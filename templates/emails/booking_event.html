<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#1d2b4f;color:#ffffff;padding:18px 24px;font-size:18px;font-weight:bold;">{{ site_name }}</td></tr>
        <tr><td style="padding:24px;">
          <h1 style="margin:0 0 12px;font-size:20px;">{{ heading }}</h1>
          <p style="margin:0 0 16px;line-height:1.5;">Hi {{ name }},<br>{{ lead }}</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e2e8f0;">
            {% for label, value in rows %}
            <tr>
              <td style="padding:8px 0;border-bottom:1px solid #e2e8f0;color:#718096;width:40%;">{{ label }}</td>
              <td style="padding:8px 0;border-bottom:1px solid #e2e8f0;font-weight:bold;">{{ value }}</td>
            </tr>
            {% endfor %}
          </table>
          {% if note %}<p style="margin:16px 0 0;color:#4a5568;">Note: {{ note }}</p>{% endif %}
          {% if action_url %}<p style="margin:20px 0 0;"><a href="{{ action_url }}" style="display:inline-block;background:#2f9e6b;color:#ffffff;text-decoration:none;padding:10px 22px;border-radius:6px;font-weight:bold;">{{ action_label }}</a></p>{% endif %}
        </td></tr>
        <tr><td style="padding:14px 24px;background:#f7f9fb;color:#718096;font-size:12px;">This is an automated message from {{ site_name }}.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
